<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enwis — Internet yo'q</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #161A2C;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 18px; margin: 0; }
      p { font-size: 14px; color: #64748b; margin: 0; max-width: 320px; }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border-radius: 999px;
        border: none;
        background: #161A2C;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Internet aloqasi yo'q</h1>
      <p>Enwis ilovasi hozir oflayn. Aloqa tiklangach sahifani qayta yuklang. Test topshirish kabi amallar internet talab qiladi.</p>
      <button onclick="location.reload()">Qayta urinish</button>
    </div>
  </body>
</html>
